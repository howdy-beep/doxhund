<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doxhund Vault — Step 2 Demo</title>
  <script src="js/vault.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; background: #0a0a0c; color: #e4e4e7; max-width: 640px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.5rem; }
    label { display: block; margin: 16px 0 4px; font-size: .8rem; color: #a1a1aa; }
    input, textarea { width: 100%; box-sizing: border-box; background: #121216; border: 1px solid #27272a; color: #e4e4e7; border-radius: 8px; padding: 10px 12px; font: inherit; }
    textarea { min-height: 90px; resize: vertical; }
    button { margin: 16px 8px 0 0; background: #7c3aed; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
    button.secondary { background: #27272a; }
    pre { background: #121216; border: 1px solid #27272a; border-radius: 8px; padding: 12px; overflow-x: auto; font-size: .8rem; white-space: pre-wrap; word-break: break-all; }
    #status { margin-top: 10px; font-size: .9rem; }
    .ok { color: #4ade80; }
    .bad { color: #f87171; }
    .muted { color: #71717a; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>Doxhund Vault — Step 2 Demo</h1>
  <p class="muted">Encrypt your profile in the browser. Only the ciphertext envelope would ever be stored or sent — it is unreadable without your password.</p>

  <label for="pw">Master password</label>
  <input id="pw" type="password" value="correct horse battery staple">

  <label for="profile">Profile (JSON)</label>
  <textarea id="profile">{"name":"Jane Doe","dob":"1990-01-01","addresses":["742 Evergreen Terrace"],"phones":["5555550142"]}</textarea>

  <button id="enc">Encrypt</button>
  <button id="dec" class="secondary">Decrypt</button>

  <label>Output</label>
  <pre id="out">—</pre>
  <div id="status"></div>

  <script>
    let envelope = null;
    const out = document.getElementById("out");
    const status = document.getElementById("status");

    // All dynamic content is written with textContent (never innerHTML),
    // so user-supplied profile data can never be interpreted as markup.

    document.getElementById("enc").addEventListener("click", async () => {
      const pw = document.getElementById("pw").value;
      const profile = document.getElementById("profile").value;
      try {
        envelope = await DoxVault.encrypt(profile, pw);
        out.textContent = "Ciphertext envelope (safe to store / send):\n\n" + JSON.stringify(envelope, null, 2);
        status.textContent = "✔ Encrypted. Plaintext is not present in the output.";
        status.className = "ok";
      } catch (e) {
        envelope = null;
        out.textContent = "—";
        status.textContent = "✘ " + e.message;
        status.className = "bad";
      }
    });

    document.getElementById("dec").addEventListener("click", async () => {
      if (!envelope) { out.textContent = "Encrypt first."; status.textContent = ""; return; }
      const pw = document.getElementById("pw").value;
      try {
        const recovered = await DoxVault.decrypt(envelope, pw);
        const matches = recovered === document.getElementById("profile").value;
        out.textContent = "Recovered plaintext:\n" + recovered;
        status.textContent = matches
          ? "✔ Round-trip verified — matches original."
          : "✘ Mismatch!";
        status.className = matches ? "ok" : "bad";
      } catch (e) {
        out.textContent = "—";
        status.textContent = "✘ Decrypt failed (wrong password or tampered): " + e.name;
        status.className = "bad";
      }
    });
  </script>
</body>
</html>
